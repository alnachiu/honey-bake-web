# 甜蜜烘焙 Honey Bake —— 阿里云轻量服务器 / 任意云服务器一键运行
# 使用：docker compose up -d --build
# 数据持久化：项目目录下的 ./data 目录（数据库 + 上传图片都在里面，备份它即可）
services:
  honey-bake:
    build: .
    image: honey-bake-web:latest
    container_name: honey-bake
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # JWT_SECRET 来自同目录 .env 文件（见下方操作）；不填时用默认值
      JWT_SECRET: ${JWT_SECRET:-honey-bake-jwt-secret-key-2026}
