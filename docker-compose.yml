# 甜蜜烘焙 Honey Bake —— 阿里云轻量服务器 / 任意云服务器一键运行
# 使用：docker compose up -d --build
# 数据持久化：项目目录下的 ./data 目录（数据库 + 上传图片都在里面，备份它即可）
services:
  honey-bake:
    # 镜像由 GitHub Actions 自动构建推送到 GHCR，服务器用 docker compose pull 拉取
    image: ghcr.io/alnachiu/honey-bake-web:latest
    build: .
    container_name: honey-bake
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # JWT_SECRET 来自同目录 .env（compose 自动读取该文件做变量替换）。
      # 用 `:?` 而不是 `:-`：没配就在 `docker compose up` 当场报错并给出提示，
      # 而不是悄悄用一个公开的默认密钥把服务跑起来。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置：请在项目目录的 .env 里写入 JWT_SECRET=<新的随机密钥>}
